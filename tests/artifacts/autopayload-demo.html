:focus-visible{outline:none}

/* multi-select: the ELF badge is the checkbox */
.elf.nom.pk:before{display:none}

.elf .pinb svg{width:.85rem;height:.85rem;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.elf .pinb.on{color:var(--onp)}

.elf .pinb.on svg{fill:currentColor}

.auto-sequence{display:flex;flex-direction:column;gap:var(--s3)}
.auto-sequence .elfwrap{width:100%;min-width:0}
.auto-sequence .elf.autorow{display:grid;grid-template-columns:2rem 2.4rem minmax(0,1fr) auto;grid-template-areas:"priority check name controls" "interval interval interval interval";grid-template-rows:auto auto;gap:var(--s3);height:auto;min-height:0;padding:var(--s3);cursor:default}
.auto-priority{grid-area:priority;text-align:center;color:var(--pri2);font-size:1rem;font-weight:800;font-variant-numeric:tabular-nums}
.auto-sequence .auto-select{grid-area:check;min-width:0;width:2.4rem;height:2.4rem;min-height:2.4rem;padding:0;border-radius:9px}
.auto-select:before{display:none}
.auto-select .ack{box-sizing:border-box}
.auto-select:focus{box-shadow:var(--ring)}
.auto-sequence .n{grid-area:name;min-width:0;display:flex;align-items:center;gap:.65rem;font-size:1.02rem;white-space:normal;overflow:visible}
.auto-sequence .auto-name{min-width:0;overflow-wrap:anywhere}
.auto-sequence .aico{flex:0 0 auto}
.auto-sequence .auto-version{display:block;margin-top:.25rem;font-size:.85rem;font-weight:500;line-height:1.4;color:var(--mute)}
.auto-sequence .elf.autorow.ison .n b{color:var(--ink)}
.auto-controls{grid-area:controls;display:flex;align-items:center;gap:.5rem}
.auto-controls button{width:2.8rem;height:2.8rem;min-height:2.8rem;padding:0;font-size:1.1rem}
.auto-controls button:disabled{opacity:.35}
.auto-interval-area{grid-area:interval;display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding-top:var(--s3);border-top:1px solid var(--edge2);color:var(--mute)}
.auto-interval-area label,.auto-end{font-size:.9rem;line-height:1.5}
.auto-interval-area .dslide{flex:0 1 24rem;width:100%;min-width:0}
.auto-settings .dslide{flex:0 1 24rem;width:100%;min-width:0}
.auto-settings .dslide input[type=range],.auto-interval-area .dslide input[type=range]{width:100%;min-width:0}
.auto-end{grid-area:interval;display:block;color:var(--mute);padding-top:var(--s3);border-top:1px solid var(--edge2)}
.auto-sequence .autorow:not(.ison){grid-template-areas:"priority check name name";grid-template-rows:auto;opacity:.85}
.auto-sequence .drag-over{outline:2px solid var(--pri2);border-radius:var(--r2)}
@media(max-width:680px){
 .auto-settings .optrow,.auto-interval-area{flex-direction:column;align-items:stretch;gap:.65rem}
 .auto-settings .dslide,.auto-interval-area .dslide{flex:0 0 auto}
 .auto-sequence .elf.autorow{grid-template-columns:1.5rem 2.4rem minmax(0,1fr);grid-template-areas:"priority check name" ". controls controls" "interval interval interval";gap:.65rem}
 .auto-controls{justify-content:flex-end}
 .auto-sequence .autorow:not(.ison){grid-template-areas:"priority check name";grid-template-rows:auto}
}

 ar:['بدء التشغيل','تحميل الحمولات','اكتمل التحميل','فتح ELF Launcher','إلغاء AutoPayload','قيد الانتظار','جارٍ الإرسال','تم الإرسال','خطأ','تم التخطي','ملغى','تمت معالجة {n} من {total}','{ok} مرسل · {fail} فشل · {skip} متخطى · {cancel} ملغى','تم الإرسال إلى elfldr؛ التنفيذ غير مؤكد.','سجل الأحداث','انقطع الاتصال. إعادة الاتصال…','طُلب الإلغاء…']
};

Object.keys(AUTO_WORDS).forEach(function(lang){ BOOT_WORDS[lang]=BOOT_WORDS[lang].concat(AUTO_WORDS[lang]); });
var BOOT_DETAILS={en:'View details',pt:'Ver detalhes',es:'Ver detalles',fr:'Voir les détails',de:'Details anzeigen',it:'Mostra dettagli',ru:'Подробнее',ja:'詳細を表示',zh:'查看详情',ar:'عرض التفاصيل'};
Object.keys(BOOT_DETAILS).forEach(function(lang){BOOT_WORDS[lang][14]=BOOT_DETAILS[lang];});
/* Register splash labels with the launcher's normal language fallback. */
if(typeof I18N!=='undefined')Object.keys(BOOT_WORDS).forEach(function(lang){
  BOOT_WORDS[lang].forEach(function(label,i){I18N[lang]['bootLabel'+i]=label;});
});
function bootText(i,vars){
  if(typeof I18N!=='undefined')return t('bootLabel'+i,vars);
  var s=(BOOT_WORDS[LANG]||BOOT_WORDS.en)[i]||BOOT_WORDS.en[i]||'';
  return s.replace(/\{(\w+)\}/g,function(m,k){return vars && vars[k]!=null?vars[k]:m;});
}
function bootTerminal(j){return /^(completed|cancelled|error)$/.test(j.phase);}
function bootModel(j){
  var counts={ok:0,fail:0,skip:0,cancel:0}, labels={pending:5,loading:6,success:7,error:8,skipped:9,cancelled:10};
  var items=j.items||[], rows='',i,s;
  for(i=0;i<items.length;i++){
    s=items[i].status;
    if(s==='success') counts.ok++; else if(s==='error') counts.fail++; else if(s==='skipped') counts.skip++; else if(s==='cancelled') counts.cancel++;
    rows+='<li class="boot-item" data-status="'+esc(s)+'"><span class="boot-symbol">'+(s==='success'?'✓':s==='error'?'!':s==='loading'?'◉':s==='cancelled'?'−':'○')+'</span><span class="boot-item-name">'+esc(items[i].name)+'</span><span class="boot-item-state">'+esc(bootText(labels[s]==null?5:labels[s]))+'</span><small class="boot-detail" dir="auto">'+esc(items[i].detail||'')+'</small></li>';
  }
  var interval=j.phase==='interval', waiting=j.phase==='waiting'||interval, terminal=bootTerminal(j), pct=j.total?Math.floor(j.completed/j.total*100):0;
  var fraction=waiting&&!interval?(j.delay_total?1-j.delay_remaining/j.delay_total:0):(j.total?j.completed/j.total:0);
  return {rows:rows,terminal:terminal,title:j.phase==='cancelled'?bootText(10):j.phase==='error'?bootText(8):bootText(terminal?2:waiting?0:1),value:waiting?String(Math.ceil(j.delay_remaining)):pct+'%',fraction:Math.max(0,Math.min(1,fraction)),summary:terminal?bootText(12,counts):waiting?(interval?bootText(18,{n:Math.ceil(j.delay_remaining)}):bootText(24)+' · '+Math.ceil(j.delay_remaining)):bootText(11,{n:j.completed,total:j.total})};
}
function bootDismiss(){
  bootView.dismissed=true; bootView.visible=false;
  bootView.finish=null;
  document.getElementById('autobanner').className='';
  var main=document.getElementById('main'); if(main) main.removeAttribute('aria-hidden');
  if(typeof showHome==='function') showHome();
}
function bootRender(j){
  if(!j || !j.ok || !j.session) return;
  if(bootView.session!==j.session){bootView.session=j.session;bootView.dismissed=false;bootView.finish=null;}
  bootView.last=j;
  /* Only observers that see an active run show it. Terminal snapshots on a
   * later open never replay the splash. A browser-local session ID suppresses
   * refresh/reopen; all execution and configuration stay on the console. */
  if(!bootView.visible){
    if(bootView.dismissed || bootTerminal(j) || !j.total) return;
    try{if(localStorage.getItem('elf-boot-view')===j.session) return;localStorage.setItem('elf-boot-view',j.session);}catch(e){}
    bootView.visible=true;
    document.getElementById('autobanner').className='show';
    var main=document.getElementById('main');if(main) main.setAttribute('aria-hidden','true');
    document.getElementById('autobannercancel').focus();
  }
  if(bootView.dismissed) return;
  var m=bootModel(j), cancel=document.getElementById('autobannercancel');
  document.getElementById('autobannertext').textContent=m.title;
  document.getElementById('bootvalue').textContent=m.value;
  document.getElementById('bootarc').style.strokeDashoffset=String(327*(1-m.fraction));
  document.getElementById('bootsummary').textContent=m.summary;
  document.getElementById('bootcount').textContent=j.completed+' / '+j.total;
  document.getElementById('bootheading').textContent=t('autoPayload');
  var list=document.getElementById('bootitems');
  if(list.innerHTML!==m.rows){
    list.innerHTML=m.rows;
    var active=list.querySelector?list.querySelector('[data-status="loading"]'):null;
    if(active && (active.offsetTop<list.scrollTop || active.offsetTop+active.offsetHeight>list.scrollTop+list.clientHeight))
      list.scrollTop=Math.max(0,active.offsetTop-list.clientHeight/2);
  }
  document.getElementById('bootnote').textContent=bootText(13);
  cancel.textContent=bootText(4);cancel.hidden=m.terminal;cancel.disabled=!!j.cancel_requested||bootView.cancelling;
  document.getElementById('bootopen').textContent=bootText(17);
  document.getElementById('autobanner').setAttribute('dir',LANG==='ar'?'rtl':'ltr');
  document.getElementById('bootlog').textContent=bootText(14);
  document.getElementById('bootlog').hidden=!m.terminal;
  if(j.cancel_requested) document.getElementById('bootnote').textContent=bootText(16);
  if(m.terminal && !bootView.finish){
    document.getElementById('bootopen').focus();
    bootView.finish=true;
  }
}
function bootPoll(){
  if(!isConsoleHost()) return;
  var finished=false, timer=setTimeout(function(){if(!finished){finished=true;bootView.poll=setTimeout(bootPoll,1000);}},4000);
  fetch('/auto-status',{method:'GET',cache:'no-store'}).then(function(r){if(!r.ok) throw Error(r.status);return r.json();}).then(function(j){
    if(finished) return; finished=true;clearTimeout(timer);bootRender(j);
    if(!bootTerminal(j)) bootView.poll=setTimeout(bootPoll,250);
  }).catch(function(){
    if(finished) return;finished=true;clearTimeout(timer);
    if(bootView.visible) document.getElementById('bootnote').textContent=bootText(15);
    bootView.poll=setTimeout(bootPoll,1000);
  });
}
function watchElfldrThenAuto(){if(!bootView.poll){bootView.poll=true;bootPoll();}}
function padCancelAuto(){
  if(!bootView.visible || !bootView.last || bootTerminal(bootView.last) || bootView.cancelling) return;
  bootView.cancelling=true;
  document.getElementById('autobannercancel').disabled=true;
  fetch('/auto-cancel?session='+encodeURIComponent(bootView.session),{method:'POST',headers:{'X-ELFL':'1'},cache:'no-store'}).then(function(r){
    if(!r.ok) throw Error(r.status);
    bootView.cancelling=false;document.getElementById('bootnote').textContent=bootText(16);
  }).catch(function(){bootView.cancelling=false;document.getElementById('autobannercancel').disabled=false;document.getElementById('bootnote').textContent=bootText(15);});
}
function autoArmed(){return !!(bootView.visible && bootView.last && !bootTerminal(bootView.last));}


document.getElementById('bootopen').onclick=bootDismiss;
document.getElementById('bootlog').onclick=function(){var list=document.getElementById('bootitems');list.className=list.className==='details'?'':'details';};
document.getElementById('autobannercancel').onclick=padCancelAuto;
document.addEventListener('keydown',function(e){if(e.key==='Escape')padCancelAuto();});
function demo(n,fail){
 clearInterval(clock);clearTimeout(bootView.finish);
 bootView={session:'',visible:false,dismissed:false,last:null,poll:null,finish:null,cancelling:false};
 state={ok:true,session:'demo-'+(++seq),phase:'waiting',delay_remaining:10,delay_total:10,total:n,completed:0,items:[]};
 for(var i=0;i<n;i++)state.items.push({name:['Kstuff Lite.elf','ShadowMountPlus.elf','ProsperoMgr.elf'][i]||'Payload '+(i+1)+'.elf',status:'pending'});
 var began=Date.now(),next=0;bootRender(state);
 clock=setInterval(function(){
  if(state.cancel_requested){for(var k=0;k<n;k++){if(state.items[k].status==='pending')state.items[k].status='cancelled';else if(state.items[k].status==='loading')state.items[k].status='success';}state.phase='cancelled';state.completed=n;}
  else if(Date.now()-began<10000){state.delay_remaining=Math.max(0,10-(Date.now()-began)/1000);}
  else if(next<n){state.phase='loading';if(state.items[next].status==='pending')state.items[next].status='loading';else{state.items[next].status=fail&&next===1?'error':fail&&next===2?'skipped':'success';state.completed=++next;}}
  else state.phase='completed';
  bootRender(state);if(bootTerminal(state))clearInterval(clock);
 },350);
}
demo(3);
